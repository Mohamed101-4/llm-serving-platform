[project]
name = "llmserve"
version = "0.1.0"
description = "Distributed LLM serving platform: smart routing, overload protection, benchmarks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",  # native telemetry switch
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
