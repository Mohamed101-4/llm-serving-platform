# Real GPU cluster: vLLM workers, one GPU each. Not tested here (no NVIDIA GPU); see docs/K8S.md.
# Push the router image to your registry and set it below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: llmserve:dev
    newName: ghcr.io/YOUR_USER/llmserve
    newTag: latest
patches:
  - path: vllm-worker.yaml
  - target: {kind: ScaledObject, name: llmserve-worker}
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 8
      - op: replace
        path: /spec/triggers/0/metadata/targetValue
        value: "64"
